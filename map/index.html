<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بررسی حصار جغرافیایی</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { font-family: Tahoma, sans-serif; padding: 20px; line-height: 1.6; }
        #map { height: 400px; width: 100%; margin-bottom: 20px; border: 1px solid #ccc; border-radius: 8px; }
        .controls { display: flex; flex-direction: column; gap: 10px; max-width: 400px; }
        input, select { padding: 8px; border: 1px solid #ccc; border-radius: 4px; }
        button { padding: 10px; cursor: pointer; background: #007bff; color: white; border: none; border-radius: 4px; }
        button:hover { background: #0056b3; }
        #result { margin-top: 15px; padding: 10px; border-radius: 4px; font-weight: bold; }
    </style>
</head>
<body>

    <h2>بررسی حصار جغرافیایی</h2>
    <div id="map"></div>
    <div class="controls">
        <label>مکان (از جدول locations):</label>
        <select id="placeId">
            <option value="">در حال بارگذاری مکان‌ها…</option>
        </select>

        <label>عرض جغرافیایی (Lat):</label>
        <input id="inLat" type="text" readonly placeholder="روی نقشه کلیک کنید">
        
        <label>طول جغرافیایی (Lon):</label>
        <input id="inLon" type="text" readonly placeholder="روی نقشه کلیک کنید">
        
        <button id="btnCheck">بررسی حصار</button>
    </div>

    <div id="result"></div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // مقداردهی نقشه (مرکز تهران)
        const map = L.map('map').setView([35.6892, 51.3890], 12);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap contributors'
        }).addTo(map);

        let marker;
        let fenceLayer;          // لایهٔ محدودهٔ مکان انتخاب‌شده
        const locationsById = {}; // کش مکان‌های خوانده‌شده از جدول locations

        // بارگذاری مکان‌ها از دیتابیس (جدول locations)
        async function loadLocations() {
            const select = document.getElementById('placeId');
            try {
                const response = await fetch('api/locations.php');
                const data = await response.json();
                if (!data.success) throw new Error(data.error);

                select.innerHTML = '<option value="">— انتخاب مکان —</option>';
                for (const loc of data.locations) {
                    locationsById[loc.id] = loc;
                    const opt = document.createElement('option');
                    opt.value = loc.id;
                    opt.textContent = `${loc.title} (${loc.location_code})`;
                    select.appendChild(opt);
                }
            } catch (err) {
                select.innerHTML = '<option value="">خطا در بارگذاری مکان‌ها</option>';
            }
        }
        loadLocations();

        // با انتخاب مکان، محدودهٔ آن روی نقشه رسم شود
        document.getElementById('placeId').addEventListener('change', function() {
            if (fenceLayer) {
                map.removeLayer(fenceLayer);
                fenceLayer = null;
            }
            const loc = locationsById[this.value];
            if (!loc) return;

            if (loc.geojson) {
                fenceLayer = L.geoJSON(loc.geojson, {
                    style: { color: '#007bff', weight: 2, fillOpacity: 0.15 }
                }).addTo(map);
                map.fitBounds(fenceLayer.getBounds());
            } else if (loc.lat || loc.lon) {
                map.setView([loc.lat, loc.lon], 14);
            }
        });

        // رویداد کلیک روی نقشه برای انتخاب مختصات
        map.on('click', function(e) {
            const { lat, lng } = e.latlng;
            document.getElementById('inLat').value = lat.toFixed(6);
            document.getElementById('inLon').value = lng.toFixed(6);

            if (marker) {
                marker.setLatLng(e.latlng);
            } else {
                marker = L.marker(e.latlng).addTo(map);
            }
        });

        // رویداد بررسی حصار
        document.getElementById('btnCheck').addEventListener('click', async function() {
            const id = document.getElementById('placeId').value;
            const lat = document.getElementById('inLat').value;
            const lon = document.getElementById('inLon').value;
            const resultDiv = document.getElementById('result');

            if (!id || !lat || !lon) {
                alert("لطفاً شناسه مکان را وارد کرده و نقطه‌ای را روی نقشه انتخاب کنید.");
                return;
            }

            resultDiv.textContent = "در حال بررسی...";
            resultDiv.style.color = "black";

            try {
                const response = await fetch(`geofence/check.php?id=${id}&lat=${lat}&lon=${lon}`);
                const data = await response.json();

                if (data.success) {
                    resultDiv.textContent = data.inside
                        ? `نتیجه: داخل محدوده (${data.name})`
                        : "نتیجه: خارج از محدوده";
                    resultDiv.style.color = data.inside ? "green" : "red";
                } else {
                    resultDiv.textContent = "خطا: " + (data.error || "امکان دریافت پاسخ از سرور وجود ندارد.");
                    resultDiv.style.color = "red";
                }
            } catch (err) {
                resultDiv.textContent = "خطای ارتباطی با سرور.";
                resultDiv.style.color = "red";
            }
        });
    </script>
</body>
</html>
